steps:
  # Step 1: Android SDK 설치 및 빌드
  - name: 'gradle:8.4.0-jdk17'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e

        # Install Android SDK Command Line Tools
        apt-get update -qq && apt-get install -y -qq wget unzip

        mkdir -p /opt/android-sdk/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip
        unzip -q /tmp/cmdtools.zip -d /opt/android-sdk/cmdline-tools
        mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
        rm /tmp/cmdtools.zip

        export ANDROID_HOME=/opt/android-sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools

        # Accept licenses and install SDK
        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

        # Build APK
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

        # Copy APK to workspace root for upload
        cp app/build/outputs/apk/debug/app-debug.apk /workspace/elevator-call-debug.apk
        echo "Build completed: elevator-call-debug.apk"
    env:
      - 'ANDROID_HOME=/opt/android-sdk'
      - 'GRADLE_OPTS=-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g'

  # Step 2: APK를 GCS 버킷에 업로드
  - name: 'gcr.io/cloud-builders/gsutil'
    args:
      - 'cp'
      - '/workspace/elevator-call-debug.apk'
      - 'gs://${PROJECT_ID}-artifacts/elevator-call/elevator-call-debug.apk'

# APK 아티팩트 저장
artifacts:
  objects:
    location: 'gs://${PROJECT_ID}-artifacts/elevator-call/'
    paths:
      - '/workspace/elevator-call-debug.apk'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
  diskSizeGb: 50

timeout: '1200s'
