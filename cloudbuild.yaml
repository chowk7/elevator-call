steps:
  # Step 1: Android 빌드 이미지 빌드 (캐시 사용)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/android-builder:latest'
      - '--cache-from'
      - 'gcr.io/$PROJECT_ID/android-builder:latest'
      - '.'
    id: 'build-image'

  # Step 2: 빌드 이미지를 Registry에 Push (캐시 저장)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/android-builder:latest'
    id: 'push-image'
    waitFor: ['build-image']

  # Step 3: APK 빌드
  - id: 'build-apk'
    name: 'gcr.io/$PROJECT_ID/android-builder:latest'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -ex
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --stacktrace
        cp app/build/outputs/apk/debug/app-debug.apk /workspace/elevator-call-debug.apk
        echo "APK 빌드 완료"
    env:
      - 'GRADLE_OPTS=-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g'
    waitFor: ['push-image']

  # Step 4: APK를 GCS에 업로드
  - name: 'gcr.io/cloud-builders/gsutil'
    args:
      - 'cp'
      - '/workspace/elevator-call-debug.apk'
      - 'gs://$PROJECT_ID-artifacts/elevator-call/elevator-call-debug.apk'
    waitFor: ['build-apk']

artifacts:
  objects:
    location: 'gs://$PROJECT_ID-artifacts/elevator-call/'
    paths:
      - '/workspace/elevator-call-debug.apk'

options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 50
  logging: LEGACY

timeout: '1800s'
